name: Secret readiness check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-openai-secret:
    name: Validate server-side OpenAI secret
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate OPENAI_API_KEY wiring
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node ./scripts/validate-server-env.mjs
